  <main>
   <section>
    <h1>Login</h1>
    <form id="login-form" >
     <label for="login-email">Email </label>
     <input autocomplete="email" id="login-email" name="email" required="" type="email"/>
     <small id="login-email-error">
     </small>
     <label for="login-password"> Password </label>
     <input autocomplete="current-password" id="login-password" minlength="6" name="password" required="" type="password"/>
     <small id="login-password-error">
     </small>
     <button class="btn btn-dark mt-3" type="submit">Login</button>
    </form>
   </section>
